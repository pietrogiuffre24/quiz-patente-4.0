    const q = quizList[qIdx];
    const groups = Math.ceil(quizList.length / 10), curGroup = Math.floor(qIdx / 10);
    app.innerHTML = renderTopbar() + `<div class="container"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="color:#0284C7">${quizMode==='sim'?'Tempo: '+Math.floor(timerSec/60)+':'+String(timerSec%60).padStart(2,'0'):'Allenamento'}</b><button class="icon-btn" style="background:#FEE2E2;color:#DC2626" onclick="askCloseQuiz()">X</button></div>${quizMode==='sim'?`<div class="block-tabs">${Array.from({length:groups},(_,g)=>`<div class="block-tab ${g===curGroup?'active':''}" onclick="qIdx=${g*10};render()">${g*10+1}-${Math.min((g+1)*10,quizList.length)}</div>`).join('')}</div><div class="q-grid">${Array.from({length:Math.min(10,quizList.length-curGroup*10)},(_,i)=>{const idx=curGroup*10+i;const cls=flagged[idx]?'flagged':(answers[idx]!==undefined?'answered':'');return`<div class="q-num ${cls} ${idx===qIdx?'current':''}" onclick="qIdx=${idx};render()">${idx+1}</div>`}).join('')}</div>`:''}<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:17px">${qIdx+1}) ${q.text}</b><button class="icon-btn" onclick="speak('${q.text.replace(/'/g,"\\'")}')">🔊</button></div><div class="vf-row"><button class="vf-btn ${answers[qIdx]===true?(quizMode==='topic'?(q.ans===true?'correct':'wrong'):'selected'):''}" onclick="answerQ(true)">V</button><button class="vf-btn ${answers[qIdx]===false?(quizMode==='topic'?(q.ans===false?'correct':'wrong'):'selected'):''}" onclick="answerQ(false)">F</button></div>${quizMode==='topic'&&answers[qIdx]!==undefined&&answers[qIdx]!==q.ans?`<div style="margin-top:12px;padding:10px;background:#FEF2F2;border:1.5px solid #DC2626;border-radius:10px;color:#991B1B"><b>Risposta esatta: ${q.ans?'VERO':'FALSO'}</b><br>${q.exp}</div>`:''}<div style="display:flex;justify-content:space-between;margin-top:16px;gap:8px"><button class="icon-btn" onclick="if(qIdx>0){qIdx--;render()}">Indietro</button>${quizMode==='sim'?`<button class="icon-btn" style="background:#FEF9C3" onclick="flagged[${qIdx}]=!flagged[${qIdx}];render()">Rivedi</button>`:''}${qIdx<quizList.length-1?`<button class="primary-btn" style="width:auto" onclick="qIdx++;render()">Avanti</button>`:`<button class="primary-btn" style="width:auto;background:#16A34A" onclick="askSubmitQuiz()">${quizMode==='sim'?t('deliver'):'Fine'}</button>`}</div></div></div>`;
  } else if (view === 'result') {
    const passed = lastResult.errors <= currentSub.maxErr;
    app.innerHTML = renderTopbar() + `<div class="container"><div class="card" style="text-align:center"><div style="font-size:32px;font-weight:900;color:${passed?'#16A34A':'#DC2626'}">${passed?t('pass'):t('fail')}</div><div style="font-weight:800;margin:10px 0;color:${passed?'#16A34A':'#DC2626'}">"${lastResult.rhyme}"</div><div>Errori: ${lastResult.errors} / Max: ${currentSub.maxErr}</div><button class="primary-btn" style="margin-top:14px" onclick="view='license';render()">Torna alla Patente</button></div>${lastResult.wrongList.map(w=>`<div class="card" style="border-left:6px solid #DC2626"><b>${w.text}</b><br><span style="color:#16A34A">Esatta: ${w.ans?'VERO':'FALSO'}</span><br><small>${w.exp}</small></div>`).join('')}</div>`;
  } else if (view === 'admin') {
    app.innerHTML = renderTopbar() + `<div class="container"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Pannello Admin (${state.adminUser})</b><button class="icon-btn" onclick="view='home';render()">Esci</button></div><div style="margin-top:12px"><b>Importa Listati (JSON):</b> <input type="file" accept=".json" onchange="importListato(event)"></div></div><div class="card"><b>Allievi (${Object.keys(state.users).length})</b>${Object.keys(state.users).map(u=>`<div style="border:1px solid #CBD5E1;border-radius:10px;padding:10px;margin-top:8px"><div style="display:flex;justify-content:space-between"><b>${u}</b><button class="icon-btn" style="color:#DC2626" onclick="delete state.users['${u}'];saveState();render()">Elimina</button></div>${(state.users[u].history||[]).map((h,hi)=>`<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px"><span>${h.subName} • ${h.passed?'IDONEO':'RESPINTO'} (${h.errors} err)</span><button class="icon-btn" onclick="printSheet('${u}',${hi})">Stampa Scheda</button></div>`).join('')}</div>`).join('')}</div></div>`;
  }
}
function setName() { const v = document.getElementById('uname').value.trim(); if (!v) return alert('Inserisci il tuo nome'); state.currentUser = v; if (!state.users[v]) state.users[v] = { progress: {}, history: [] }; saveState(); render(); }
function selectSub(cid, sid) { if (!state.currentUser) return alert('Inserisci prima il tuo nome!'); const c = CATEGORIES.find(x => x.id === cid); currentSub = c.subs.find(s => s.id === sid); view = 'license'; render(); }
function startQuiz(mode, tid) { quizMode = mode; qIdx = 0; answers = {}; flagged = {}; const pool = [...BASE_QUIZ, ...state.customQuestions].sort(() => Math.random() - 0.5); const count = mode === 'sim' ? currentSub.total : 10; quizList = Array.from({ length: count }, (_, i) => pool[i % pool.length]); if (mode === 'sim') { timerSec = currentSub.mins * 60; clearInterval(timerInt); timerInt = setInterval(() => { timerSec--; if (timerSec <= 0) finishSim(); else if (view === 'quiz') render(); }, 1000); } view = 'quiz'; render(); }
function answerQ(val) { answers[qIdx] = val; if (quizMode === 'topic') { const p = getProg(currentSub.id); const tid = quizList[qIdx].topic || 1; p.topics[tid] = Math.min(100, (p.topics[tid] || 0) + 10); if (val === quizList[qIdx].ans) p.right++; else p.wrong++; saveState(); } render(); }
function askCloseQuiz() { if (Object.keys(answers).length < quizList.length) showModal(t('closeWarn'), () => { clearInterval(timerInt); view = 'license'; render(); }); else { clearInterval(timerInt); view = 'license'; render(); } }
	function askSubmitQuiz() { if (quizMode === 'topic') { view = 'license'; render(); return; } if (Object.keys(answers).length < quizList.length) showModal(t('emptyWarn'), finishSim); else finishSim(); }
function finishSim() { clearInterval(timerInt); let errors = 0; const wrongList = [], details = []; quizList.forEach((q, i) => { if (answers[i] !== q.ans) { errors++; wrongList.push(q); } details.push({ text: q.text, ans: q.ans, userAns: answers[i] }); }); const passed = errors <= currentSub.maxErr; const grp = currentSub.id.startsWith('NAUT') ? 'naut' : (['AM','A','B','REV_AM','REV_ALL'].includes(currentSub.id) ? 'ab' : 'sup'); const rArr = RHYMES[grp][passed ? 'ok' : 'ko']; const rhyme = rArr[Math.floor(Math.random() * rArr.length)]; const p = getProg(currentSub.id); p.right += (quizList.length - errors); p.wrong += errors; if (passed) p.simPassed = true; state.users[state.currentUser].history.unshift({ subName: currentSub.name, date: new Date().toLocaleString('it-IT'), passed, errors, total: quizList.length, details }); saveState(); lastResult = { errors, wrongList, rhyme }; view = 'result'; render(); speak(rhyme); }
function tryUnlock() { const p = getProg(currentSub.id); const all100 = TOPICS.every(tp => (p.topics[tp.id] || 0) >= 100); if (!all100 || !p.simPassed) return showModal(t('lockWarn'), null, true); p.unlocked = true; p.unlockDate = new Date().toLocaleDateString('it-IT'); saveState(); render(); }
function openAdminLogin() { document.getElementById('modal-root').innerHTML = `<div class="modal-bg"><div class="modal-box"><b>Accesso Admin</b><input id="adm-u" placeholder="Nome Utente" style="width:100%;padding:10px;border:1.5px solid #CBD5E1;border-radius:8px;margin:10px 0"><input id="adm-p" type="password" placeholder="Password" style="width:100%;padding:10px;border:1.5px solid #CBD5E1;border-radius:8px;margin-bottom:12px"><div style="display:flex;gap:8px"><button class="icon-btn" style="flex:1" onclick="closeModal()">Annulla</button><button class="primary-btn" style="flex:1" onclick="checkAdmin()">Entra</button></div></div></div>`; }
function checkAdmin() { if (document.getElementById('adm-u').value === state.adminUser && document.getElementById('adm-p').value === state.adminPass) { closeModal(); view = 'admin'; render(); } else alert('Credenziali non valide'); }
function importListato(e) { const f = e.target.files; if (!f) return; const r = new FileReader(); r.onload = () => { try { const arr = JSON.parse(r.result); const ex = new Set([...BASE_QUIZ, ...state.customQuestions].map(x => x.text.trim().toLowerCase())); let add = 0; arr.forEach(it => { if (it.text && !ex.has(it.text.trim().toLowerCase())) { state.customQuestions.push(it); ex.add(it.text.trim().toLowerCase()); add++; } }); saveState(); alert('Importate ' + add + ' nuove domande.'); } catch { alert('JSON non valido'); } }; r.readAsText(f); }
function printSheet(u, idx) { const item = state.users[u].history[idx]; const w = window.open('', '_blank'); const rows = item.details.map((d, i) => '<tr style="' + (d.userAns !== d.ans ? 'background:#FEE2E2' : '') + '"><td></td><td>' + (i + 1) + ') ' + d.text + '</td><td style="text-align:center;font-weight:900">' + (d.ans === true ? '●' : '') + (d.userAns === true ? ' X' : '') + '</td><td style="text-align:center;font-weight:900">' + (d.ans === false ? '●' : '') + (d.userAns === false ? ' X' : '') + '</td></tr>').join(''); w.document.write('<html><head><title>Scheda</title><style>body{font-family:sans-serif;padding:20px}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{border:1.5px solid #000;padding:6px}</style></head><body><table><tr><td><b>QUIZ PATENTE 4.0</b><br>Candidato: <b>' + u + '</b><br>Patente: <b>' + item.subName + '</b></td><td>Data: ' + item.date + '<br>Esito: <b>' + (item.passed ? 'IDONEO' : 'RESPINTO') + '</b> (' + item.errors + ' err)</td></tr></table><table><tr><th>Fig.</th><th>Domanda</th><th>V</th><th>F</th></tr>' + rows + '</table></body></html>'); w.document.close(); setTimeout(() => w.print(), 300); }
function showModal(msg, onYes, okOnly) { document.getElementById('modal-root').innerHTML = `<div class="modal-bg"><div class="modal-box" style="text-align:center"><div style="font-weight:800;margin-bottom:16px">${msg}</div><div style="display:flex;gap:8px">${okOnly ? `<button class="primary-btn" onclick="closeModal()">OK</button>` : `<button class="primary-btn" onclick="closeModal();(${onYes})()">${t('yes')}</button><button class="icon-btn" style="flex:1" onclick="closeModal()">${t('no')}</button>`}</div></div></div>`; }
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
render();
</script>
</body>
