function t(key) { return (T[state.lang] && T[state.lang][key]) || T.it[key] || key; }
function speak(text) {
if (!state.audioEnabled || !('speechSynthesis' in window)) return;
window.speechSynthesis.cancel();
const u = new SpeechSynthesisUtterance(text);
const langObj = LANGS.find(l => l.code === state.lang);
u.lang = langObj ? langObj.voice : 'it-IT';
u.rate = 0.96;
window.speechSynthesis.speak(u);
}
function playTone(ok) {
if (!state.audioEnabled) return;
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.connect(gain); gain.connect(ctx.destination);
osc.frequency.value = ok ? 587.33 : 220;
gain.gain.setValueAtTime(0.15, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
osc.start(); osc.stop(ctx.currentTime + 0.35);
} catch(e) {}
}
function ensureUser(name) {
const clean = name.trim();
if (!db.users[clean]) {
db.users[clean] = { name: clean, blocked: false, progress: {}, history: [] };
saveDB(db);
}
return db.users[clean];
}
function getSubProgress(userName, subId) {
const u = ensureUser(userName);
if (!u.progress[subId]) {
u.progress[subId] = { topics: {}, errors: [], examPassed: false, unlockDate: null };
saveDB(db);
}
return u.progress[subId];
}

                <span>${item.subName} • ${item.date} • <b style="color:${item.passed?'#16A34A':'#DC2626'}">${item.passed?'IDONEO':'RESPINTO'}</b> (${item.errors} err)</span>
                <button class="icon-btn" onclick="printSheet('${u}', ${hi})">Stampa Scheda Ufficiale</button>
              </div>`).join('') || '<div style="font-size:12px;color:#64748B;margin-top:4px">Nessuna simulazione svolta</div>'}
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }
}

let lastResult = null;
function startQuiz(mode, topicId) {
  quizMode = mode; qIdx = 0; answers = {}; flagged = {};
  const pool = [...BASE_QUIZ, ...state.customQuestions].sort(() => Math.random() - 0.5);
  const count = mode === 'sim' ? currentSub.total : 10;
  quizList = Array.from({length: count}, (_, i) => pool[i % pool.length]);
  if (mode === 'sim') {
    timerSec = currentSub.mins * 60;
    clearInterval(timerInt);
    timerInt = setInterval(() => { timerSec--; if (timerSec <= 0) finishSim(); else if (view === 'quiz') render(); }, 1000);
  }
  view = 'quiz'; render();
}

function answerQ(val) {
  answers[qIdx] = val;
  if (quizMode === 'topic') {
    const p = getProg(currentSub.id);
    const tid = quizList[qIdx].topic || 1;
    p.topics[tid] = Math.min(100, (p.topics[tid] || 0) + 10);
    if (val === quizList[qIdx].ans) p.right++; else { p.wrong++; p.errors.push(quizList[qIdx]); }
    saveState();
  }
  render();
}

function askCloseQuiz() {
  if (Object.keys(answers).length < quizList.length) {
    showModal(t('closeWarn'), () => { clearInterval(timerInt); view = 'license'; render(); });
  } else { clearInterval(timerInt); view = 'license'; render(); }
}
    function askSubmitQuiz() {
if (quizMode === 'topic') { view = 'license'; render(); return; }
if (Object.keys(answers).length < quizList.length) {
showModal(t('emptyWarn'), finishSim);
} else finishSim();
}
function finishSim() {
clearInterval(timerInt);
let errors = 0; const wrongList = []; const details = [];
quizList.forEach((q, i) => {
const ok = answers[i] === q.ans;
if (!ok) { errors++; wrongList.push(q); }
details.push({ text: q.text, ans: q.ans, userAns: answers[i] });
});
const passed = errors <= currentSub.maxErr;
const grp = currentSub.id.startsWith('NAUT') ? 'naut' : (['AM','A','B','REV_AM','REV_ALL'].includes(currentSub.id) ? 'ab' : 'sup');
const rArr = RHYMES[grp][passed ? 'ok' : 'ko'];
const rhyme = rArr[Math.floor(Math.random() * rArr.length)];
const p = getProg(currentSub.id);
p.right += (quizList.length - errors); p.wrong += errors;
if (passed) p.simPassed = true;
state.users[state.currentUser].history.unshift({ subName: currentSub.name, date: new Date().toLocaleString('it-IT'), passed, errors, total: quizList.length, details });
saveState();
lastResult = { errors, wrongList, rhyme };
view = 'result'; render();
playTone(passed); speak(rhyme);
}
function tryUnlock() {
const p = getProg(currentSub.id);
const all100 = TOPICS_AB.every(tp => (p.topics[tp.id] || 0) >= 100);
if (!all100 || !p.simPassed) { showModal(t('lockWarn'), null, true); return; }
p.unlocked = true; p.unlockDate = new Date().toLocaleDateString('it-IT'); saveState(); render();
}
function openAdminLogin() {
document.getElementById('modal-root').innerHTML = <div class="modal-bg"><div class="modal-box"> <div style="font-weight:900;font-size:18px;margin-bottom:12px">Accesso Riservato Admin</div> <input id="adm-u" placeholder="Nome Utente" style="width:100%;padding:10px;border:1.5px solid #CBD5E1;border-radius:8px;margin-bottom:8px"> <input id="adm-p" type="password" placeholder="Password" style="width:100%;padding:10px;border:1.5px solid #CBD5E1;border-radius:8px;margin-bottom:12px"> <div style="display:flex;gap:8px"> <button class="icon-btn" style="flex:1" onclick="closeModal()">Annulla</button> <button class="primary-btn" style="flex:1" onclick="checkAdmin()">Entra</button> </div> </div></div>;
}
function checkAdmin() {
if (document.getElementById('adm-u').value === state.adminUser && document.getElementById('adm-p').value === state.adminPass) {
closeModal(); view = 'admin'; render();
} else alert('Credenziali non valide');
}
function importListato(e) {
const f = e.target.files[0]; if (!f) return;
const r = new FileReader();
r.onload = () => {
try {
const arr = JSON.parse(r.result);
const existing = new Set([...BASE_QUIZ, ...state.customQuestions].map(x => x.text.trim().toLowerCase()));
let added = 0;
arr.forEach(item => { if (item.text && !existing.has(item.text.trim().toLowerCase())) { state.customQuestions.push(item); existing.add(item.text.trim().toLowerCase()); added++; } });
saveState(); alert('Importate ' + added + ' nuove domande (duplicati scartati).');
} catch { alert('Formato JSON non valido'); }
};
r.readAsText(f);
}
function printSheet(userName, idx) {
const item = state.users[userName].history[idx];
const w = window.open('', '_blank');
w.document.write(`Scheda Ufficialebody{font-family:sans-serif;padding:20px}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border:1.5px solid #000;padding:6px}.box{width:26px;text-align:center;font-weight:900}

QUIZ PATENTE 4.0 – RIEPILOGO SCHEDA D'ESAME
Candidato: \({userName}</b><br>Patente Richiesta: <b>\){item.subName}
	Data: \({item.date}<br>Domande: \){item.total} | Esatte: \({item.total - item.errors} | Errate: \){item.errors}
Esito Esame: ${item.passed ? 'IDONEO' : 'RESPINTO'}

{item.details.map((d, i) => {
const wrong = d.userAns !== d.ans;
const vCell = (d.ans===true?'●':'') + (d.userAns===true?' X':'');
const fCell = (d.ans===false?'●':'') + (d.userAns===false?' X':'');
return `<tr style="{wrong?'background:#FEE2E2':''}">\({i+1}) \){d.text}\({vCell}</td><td class="box">\){fCell}`;
}).join('')}
	  </table></body></html>`);
  w.document.close();
  setTimeout(function() { w.print(); }, 300);
}
function showModal(msg, onYes, singleOk) {
document.getElementById('modal-root').innerHTML = <div class="modal-bg"><div class="modal-box" style="text-align:center"> <div style="font-weight:800;font-size:16px;margin-bottom:18px">${msg}</div> <div style="display:flex;gap:10px"> ${singleOk ? OK:${t('yes')}${t('no')}} </div> </div></div>;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
render();
  </script>
